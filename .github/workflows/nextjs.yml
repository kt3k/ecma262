name: Deploy Next.js site to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Deno
        # The editions are rendered by Lume (Deno) in the assemble step.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Assemble combined dist/
        # Builds each Lume edition (pages/build/pagefind with EDITION +
        # BASE_PATH=/ecma262/<id>) into dist/<id>/, copies the vendored Nextra
        # comparison export (nextra-poc/) into dist/nextra-poc/, and writes the
        # landing page. The Nextra site is prebuilt and committed, so CI no
        # longer runs the Next.js build.
        run: node src/assemble-dist.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
