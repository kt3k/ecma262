name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Deno
        # The whole build runs on Deno: assemble-dist.mjs and the build-chapters
        # scripts run via `deno run`, the editions render with Lume, and the one
        # npm dependency (highlight.js) is pulled via an npm: specifier — so no
        # Node or pnpm toolchain is needed.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Assemble combined dist/
        # Builds each Lume edition (pages/build/pagefind with EDITION +
        # BASE_PATH=/ecma262/<id>) into dist/<id>/, copies the vendored Nextra
        # comparison export (nextra-poc/) into dist/nextra-poc/, and writes the
        # landing page.
        run: deno run -A src/assemble-dist.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
